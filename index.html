<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Log In</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Back arrow -->
  <header class="top-nav">
    <button class="back-btn" aria-label="Go back">&#8249;</button>
  </header>

  <main class="login">
    <h1 class="title">Log In</h1>

    <form class="login-form" novalidate>
      <!-- Username / email -->
      <label class="field-label" for="username">USERNAME OR EMAIL</label>
      <div class="input-wrap">
        <input type="text" id="username" class="text-input" autocomplete="username" />
      </div>
      <a href="#" class="link small-link">Use phone number instead</a>

      <!-- Password -->
      <label class="field-label pwd-label" for="password">PASSWORD</label>
      <div class="input-wrap">
        <input type="password" id="password" class="text-input" autocomplete="current-password" />
        <button type="button" class="eye-btn" aria-label="Show password">
          <!-- eye-off icon -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#9aa0a6" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1l22 22" />
            <path d="M9.5 5.2A9.8 9.8 0 0 1 12 5c6 0 10 7 10 7a16 16 0 0 1-3 3.6" />
            <path d="M6.3 6.8A15.8 15.8 0 0 0 2 12s4 7 10 7a9.6 9.6 0 0 0 4.3-1" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        </button>
      </div>

      <!-- Log In button -->
      <button type="submit" class="login-btn" disabled>Log In</button>

      <a href="#" class="link forgot-link">Forgot your password?</a>
    </form>

    <!-- OR divider -->
    <div class="divider">
      <span class="line"></span>
      <span class="or">OR</span>
      <span class="line"></span>
    </div>

    <!-- Social buttons -->
    <button type="button" class="social-btn">
      <span class="g-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="26" height="26">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
      </span>
      <span class="social-text">Continue with Google</span>
    </button>

    <button type="button" class="social-btn">
      <span class="passkey-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ffffff" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 11c-1.5 0-2.6 1.2-2.6 3 0 2 .3 3.8-.5 5.6" />
          <path d="M12 7.5A3.5 3.5 0 0 1 15.5 11c0 3-.3 5.4-1.2 7.5" />
          <path d="M8.5 11a3.5 3.5 0 0 1 1-2.5" />
          <path d="M5.8 13.5c-.2-.8-.3-1.6-.3-2.5A6.5 6.5 0 0 1 12 4.5c2 0 3.8.9 5 2.3" />
          <path d="M11.9 14.5c0 2-.4 4-1.4 5.8" />
        </svg>
      </span>
      <span class="social-text">Sign In with Passkey</span>
    </button>

    <!-- Save login info -->
    <label class="save-row">
      <input type="checkbox" class="save-check" checked />
      <span class="checkbox-ui" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5L20 6.5" />
        </svg>
      </span>
      <span class="save-text">Save Login Info on your device</span>
    </label>
  </main>

  <script src="script.js"></script>
</body>

</html>
